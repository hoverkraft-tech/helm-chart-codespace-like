---
name: Shared - Continuous Integration for common tasks

on: # yamllint disable-line rule:truthy
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      codeql-languages: ""
      action-files: ""
      linter-env: |
        VALIDATE_JAVASCRIPT_TOOLCHAIN=
        VALIDATE_PYTHON_TOOLCHAIN=
        VALIDATE_GIT_COMMITLINT=true

  tests-charts:
    name: Tests - Charts
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Test helm charts
        uses: hoverkraft-tech/ci-github-container/actions/helm/test-chart@ec1cd960fb1a1908ac21680756eb49a4c8f018d5 # 0.40.0
