extends: default

# Raw Go templates are not YAML. Helm and Kubeconform validate their output.
ignore: |
  **/templates/**

rules:
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  line-length:
    max: 180
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
