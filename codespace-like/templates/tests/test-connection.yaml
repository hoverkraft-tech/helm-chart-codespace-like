apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "codespace-like.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codespace-like.labels" . | nindent 4 }}
  annotations:
    checkov.io/skip1: CKV_K8S_8=The Helm test exits after its connection check.
    checkov.io/skip2: CKV_K8S_9=The Helm test exits after its connection check.
    checkov.io/skip3: CKV2_K8S_6=Network policy must be defined per target cluster.
    checkov.io/skip4: CKV_K8S_10=The Helm test pod is short-lived and does not need requests.
    checkov.io/skip5: CKV_K8S_11=The Helm test pod is short-lived and does not need limits.
    checkov.io/skip6: CKV_K8S_12=The Helm test pod is short-lived and does not need requests.
    checkov.io/skip7: CKV_K8S_13=The Helm test pod is short-lived and does not need limits.
    checkov.io/skip8: CKV_K8S_15=The Helm test pod uses a pinned busybox image.
    checkov.io/skip9: CKV_K8S_20=The Helm test pod executes one command then exits.
    checkov.io/skip10: CKV_K8S_21=Release namespace is selected at install time.
    checkov.io/skip11: CKV_K8S_22=The Helm test pod needs writable filesystem for wget output.
    checkov.io/skip12: CKV_K8S_23=The Helm test pod uses upstream busybox defaults.
    checkov.io/skip13: CKV_K8S_28=The Helm test pod uses upstream busybox defaults.
    checkov.io/skip14: CKV_K8S_29=The Helm test pod uses upstream busybox defaults.
    checkov.io/skip15: CKV_K8S_30=The Helm test pod uses upstream busybox defaults.
    checkov.io/skip16: CKV_K8S_31=The Helm test pod uses upstream busybox defaults.
    checkov.io/skip17: CKV_K8S_37=The Helm test pod uses upstream busybox defaults.
    checkov.io/skip18: CKV_K8S_38=The Helm test pod uses default service account only for test hook execution.
    checkov.io/skip19: CKV_K8S_40=The Helm test pod uses upstream busybox defaults.
    checkov.io/skip20: CKV_K8S_43=The Helm test pod uses pinned busybox image tag.
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.38.0
      command:
        - 'wget'
        - -q
        - -O
        - '/dev/null'
      args:
        - http://{{ include "codespace-like.fullname" . }}:{{ .Values.service.port }}/healthz
  restartPolicy: Never
