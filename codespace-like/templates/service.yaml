apiVersion: v1
kind: Service
metadata:
  name: {{ include "codespace-like.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=Release namespace is selected at install time.
  labels:
    {{- include "codespace-like.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "codespace-like.selectorLabels" . | nindent 4 }}
