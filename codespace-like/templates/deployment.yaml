apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codespace-like.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=Release namespace is selected at install time.
    checkov.io/skip2: CKV2_K8S_6=Network policy must be defined per target cluster.
    checkov.io/skip3: CKV_K8S_43=Chart users can pin image digests in values.
  labels:
    {{- include "codespace-like.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "codespace-like.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "codespace-like.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "codespace-like.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        {{- if .Values.docker.enabled }}
        - name: docker
          # checkov:skip=CKV_K8S_20:Docker-in-Docker requires privileged mode.
          # checkov:skip=CKV_K8S_22:Docker daemon needs write access to its filesystem.
          # checkov:skip=CKV_K8S_23:Docker daemon runs as root inside the sidecar.
          # checkov:skip=CKV_K8S_28:CAP_SYS_ADMIN is required by Docker-in-Docker.
          # checkov:skip=CKV_K8S_30:Privileged sidecar is intentional for Docker-in-Docker.
          # checkov:skip=CKV_K8S_31:Sidecar seccomp is runtime-dependent for privileged mode.
          # checkov:skip=CKV_K8S_37:Docker-in-Docker needs extended Linux capabilities.
          # checkov:skip=CKV_K8S_40:Docker-in-Docker runs as root by design.
          # trivy:ignore:KSV-0001
          # trivy:ignore:KSV-0012
          # trivy:ignore:KSV-0014
          # trivy:ignore:KSV-0020
          # trivy:ignore:KSV-0104
          # trivy:ignore:KSV-0106
          # trivy:ignore:KSV-0118
          image: "{{ .Values.docker.image.repository }}:{{ .Values.docker.image.tag }}"
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          startupProbe:
            tcpSocket:
              port: 2376
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 2376
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 2376
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.docker.resources | nindent 12 }}
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
            - name: docker-certs
              mountPath: /certs
            - name: work
              mountPath: /home/coder/work
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          securityContext:
            privileged: true
        {{- end }}
        - name: coder
          # checkov:skip=CKV_K8S_43:Chart users can override image reference to use digests.
          # trivy:ignore:KSV-0125
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HOME
              value: /home/coder/work
            - name: XDG_CONFIG_HOME
              value: /home/coder/work/.config
          {{- if .Values.docker.enabled }}
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_TLS_VERIFY
              value: '1'
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_BUILDKIT
              value: '1'
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /home/coder/work
            {{- if .Values.docker.enabled }}
            - name: docker-certs
              readOnly: true
              mountPath: /certs
            {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.docker.enabled }}
        - name: docker-data
          emptyDir:
            {{- with .Values.docker.volume.sizeLimit }}
            sizeLimit: {{ . | quote }}
            {{- else }}
            {}
            {{- end }}
        - name: docker-certs
          emptyDir: {}
        {{- end }}
        - name: work
          persistentVolumeClaim:
            claimName: {{ include "codespace-like.fullname" . }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
