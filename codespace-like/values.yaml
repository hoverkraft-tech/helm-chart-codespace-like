# yaml-language-server: $schema=values.schema.json
# Default values for codespace-like.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# FIXME: this is for compatibility with hoverkraft CI
#        see https://github.com/hoverkraft-tech/ci-github-container/issues/815

# @schema
# title: namespace
# type: [string, "null"]
# @schema
namespace: ~

replicaCount: 1

image:
  repository: ghcr.io/hoverkraft-tech/docker-base-images/codespace-like
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# @schema
# title: docker
# additionalProperties: true
# @schema
docker:
  enabled: false
  image:
    repository: docker
    tag: dind
  # @schema
  # title: resources
  # additionalProperties: true
  # @schema
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  volume:
    # @schema
    # title: sizeLimit
    # type: [null, string]
    # @schema
    sizeLimit: ~

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  # @schema
  # title: ingress annotations
  # additionalProperties: true
  # @schema
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# @schema
# title: resources
# additionalProperties: true
# @schema
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http
startupProbe:
  httpGet:
    path: /healthz
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

persistence:
  enabled: true
  storageClass: ""
  size: 100Mi

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
